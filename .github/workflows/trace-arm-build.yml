name: TRACE ARM target build

on:
  push:
    branches:
      - af-s-timing-trace
  pull_request:
    branches:
      - af-s-timing-trace
  workflow_dispatch:

jobs:
  trace-arm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out EA9 firmware
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Fetch pinned ASF4 SAMD21 source
        env:
          ASF4_COMMIT: d270f79aa16dd8fd4ae3b6c14544283dcb992e9c
        run: |
          git clone --no-checkout https://github.com/adafruit/asf4.git .deps/asf4
          git -C .deps/asf4 checkout --detach "$ASF4_COMMIT"
          test "$(git -C .deps/asf4 rev-parse HEAD)" = "$ASF4_COMMIT"
          test -f .deps/asf4/samd21/include/samd21e17a.h
          test -f .deps/asf4/samd21/CMSIS/Include/core_cm0plus.h
          test -f .deps/asf4/samd21/hal/include/hal_gpio.h
          test -f .deps/asf4/samd21/hri/hri_port_d21.h

      - name: Build TRACE ARM firmware
        run: |
          make clean
          make BUILD=trace \
            TOOLCHAIN=arm-none-eabi- \
            ASF4="$PWD/.deps/asf4/samd21"

      - name: Record image and memory sizes
        run: |
          arm-none-eabi-size build/ea9-rebuild-trace.elf
          stat -c '%n %s bytes' build/ea9-rebuild-trace.bin
          grep -E '^\.(text|rodata|data|bss|_user_heap_stack)' build/ea9-rebuild-trace.map || true

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea9-trace-arm-build
          path: |
            build/ea9-rebuild-trace.elf
            build/ea9-rebuild-trace.bin
            build/ea9-rebuild-trace.map
          if-no-files-found: warn
