name: Build EA9Updater EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/win_updater/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build EA9Updater.exe
        working-directory: tools/win_updater
        shell: powershell
        run: |
          dotnet build EA9Updater.csproj -c Release -o out
          Move-Item -Force "out\EA9Updater.exe" "out\Community EA9 Firmware Updater v2.4.0-XPD0.5.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Community-EA9-Updater-v2.4.0-XPD0.5
          path: tools/win_updater/out/*.exe
