name: TRACE host tests
on:
  push:
    branches: [af-s-timing-trace]
  pull_request:
    branches: [af-s-timing-trace]
  workflow_dispatch:
jobs:
  hosttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Run complete host test suite
        run: make hosttest
